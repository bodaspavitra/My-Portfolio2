<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 700px;
    background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 50%, #020617 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .glow-orange {
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(249, 115, 22, 0.2);
    filter: blur(120px);
  }
  .glow-blue {
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.2);
    filter: blur(120px);
  }
  .content {
    position: relative;
    z-index: 10;
    width: 1100px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .left {
    width: 500px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(249, 115, 22, 0.15);
    border: 1px solid rgba(249, 115, 22, 0.4);
    border-radius: 999px;
    color: #fb923c;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .title {
    font-size: 44px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 16px;
    color: #94a3b8;
    line-height: 1.6;
    margin-top: 14px;
    max-width: 440px;
  }
  .stats {
    display: flex;
    gap: 20px;
    margin-top: 28px;
  }
  .stat-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 12px 18px;
    backdrop-filter: blur(10px);
  }
  .stat-val {
    font-size: 20px;
    font-weight: 800;
    color: #38bdf8;
  }
  .stat-lbl {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .right {
    position: relative;
    width: 540px;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desktop-card {
    position: absolute;
    width: 440px;
    height: 280px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    overflow: hidden;
    background: #0f172a;
    top: 60px;
    left: 20px;
    transform: rotate(-3deg);
  }
  .desktop-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .phone-card {
    position: absolute;
    width: 220px;
    height: 440px;
    border-radius: 36px;
    border: 3px solid rgba(249, 115, 22, 0.6);
    box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    overflow: hidden;
    background: #000;
    bottom: 20px;
    right: 30px;
    transform: rotate(4deg);
    z-index: 20;
  }
  .phone-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .mascot-card {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 110px;
    height: 110px;
    z-index: 30;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
  }
  .mascot-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="glow-orange"></div>
  <div class="glow-blue"></div>
  <div class="content">
    <div class="left">
      <div class="badge">
        <span>●</span> Web Dashboard &amp; Mobile App
      </div>
      <div class="logo-row">
        <h1 class="title">Authenticate India</h1>
      </div>
      <p class="subtitle">
        The Trust Layer of India — Enterprise identity &amp; business compliance infrastructure across real-time Govt APIs (Aadhaar, PAN, Passport, GST).
      </p>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-val" style="color: #fb923c;">100% Real-Time</div>
          <div class="stat-lbl">Govt API Verification</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #38bdf8;">Web + Mobile</div>
          <div class="stat-lbl">Dual Architecture</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #4ade80;">7% Direct</div>
          <div class="stat-lbl">Agent Slab System</div>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="desktop-card">
        <img src="WebApp-APIDoc-Preview-ImageRight.png" alt="Web Platform">
      </div>
      <div class="phone-card">
        <img src="auth-services.png" alt="Mobile App">
      </div>
      <div class="mascot-card">
        <img src="BlackCatImage.png" alt="Mascot">
      </div>
    </div>
  </div>
</body>
</html>
